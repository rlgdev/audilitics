[project]
name = "audilitics-collector"
version = "1.1.0"
description = "Collector for the Audi 'gotowe do odbioru' stock feed (Audilitics)"
requires-python = ">=3.12"
dependencies = [
  "requests==2.34.2",
  "pydantic==2.10.6",
  "PyYAML==6.0.2",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.9.6",
  "mypy==1.15.0",
  "jsonschema==4.23.0",
  "referencing==0.35.1",
  "types-PyYAML==6.0.12.20241230",
  "types-requests==2.32.0.20241016",
]

[project.scripts]
audilitics = "collector.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["collector"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108", "SIM102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
