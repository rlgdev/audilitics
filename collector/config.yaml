# Collector configuration (spec 4.5).
version: 1.1.1
base_url: https://gotowedoodbioru.audi.pl
public_repo: rlgdev/audilitics
page_size: 20000
request_budget: 10           # feed requests per run: index page, 2 directories, main pull, 6 slider pulls (ADR-0005)
request_spacing_s: 1.0
timeout_s: 60
backoff_s: [10, 30, 90]      # main pull only (spec 4.2 step 3); retries are not counted against the budget
user_agent: "audilitics/{version} (price trend research; +https://github.com/{public_repo})"

# Dropped from every item right after schema validation; never written anywhere, not even as hashes (spec 3.5).
discarded_fields: [vin, komisja, link, kod_audi, telefon]

# Apart from counts of offers, every public figure rests on at least this many offers (spec 5.5).
public_min_group: 3

gates:
  suspect_below: 0.80         # count below 80 % of the previous run -> suspect
  warn_above: 1.20            # count above 120 % -> ok with warning
  slider_badge_tolerance: 0.01  # slider vs badge total differs by more than 1 % -> warning + rules-review
min_snapshot_age_days: 6      # skip guard (spec 4.1): one snapshot a week
stale_after_days: 9           # dashboard warning (spec 7.4)
empty_runs_to_retire: 3       # model lifecycle (spec 4.6)
timezone: Europe/Warsaw
